site_name: "Ecuación de calor en dos dimensiones"
site_description: "Proyecto I de Física Computacional (FS-0432, UCR): solución numérica de la ecuación de calor 2D con FTCS en Python y C++/OpenMP."
site_author: "Fernando Rodríguez, Orlando Benavides, Samuel Rojas, Eytan Sequeira"
repo_url: https://github.com/aurodriguezb-sys/Proyecto-fisica-computacional
edit_uri: ""
docs_dir: docs
site_dir: site

theme:
  name: readthedocs
  locale: es
  highlightjs: true
  hljs_languages:
    - python
    - cpp
    - yaml

nav:
  - Inicio: index.md
  - Integrantes y estado: equipo.md
  - Fundamento y método: explanation.md
  - Tutorial: tutorials.md
  - Referencia de código: reference.md
  - Resultados y validación: resultados.md
  - Paralelismo: paralelismo.md
  - Reporte académico: reporte.md
  - Bitácora: bitacora.md

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: false

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
